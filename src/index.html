<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>STOCKLINE — Inventory Control</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#141A22" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="STOCKLINE" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      html, body, #root { height: 100%; margin: 0; }
      body { background: #0D1218; overscroll-behavior-y: contain; }
      * { -webkit-tap-highlight-color: transparent; }

      @media print {
        @page { size: 48mm auto; margin: 1mm; }
        html, body { width: 48mm; margin: 0; padding: 0; }
        body * { visibility: hidden; }
        .print-receipt, .print-receipt * { visibility: visible; }
        .print-receipt {
          position: fixed; top: 0; left: 0; width: 46mm;
        }
        .print-receipt, .print-receipt * {
          background: #fff !important; color: #000 !important; border-color: #ccc !important;
          max-width: 46mm !important;
        }
      }

      /* Elderly theme: a clearer, more legible font (Atkinson Hyperlegible,
         designed specifically for readability at low vision) plus a
         uniform size increase across the whole app \u2014 zoom scales text,
         icons, buttons, and spacing together so nothing looks mismatched. */
      .theme-elderly, .theme-elderly * {
        font-family: "Atkinson Hyperlegible", Arial, sans-serif !important;
      }
      .theme-elderly {
        zoom: 1.45;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
